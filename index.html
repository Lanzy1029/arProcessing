<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="description" content="在 iPhone Safari 中体验完全本地运行的 Emoji 表情 AR。" />
    <meta property="og:title" content="Emoji Face AR · 表情派对" />
    <meta property="og:description" content="眨眼发射爱心，张嘴喷出有趣 Emoji。无需安装，画面不会上传。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lanzy1029.github.io/arProcessing/" />
    <meta property="og:image" content="https://lanzy1029.github.io/arProcessing/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lanzy1029.github.io/arProcessing/og.png" />
    <link rel="canonical" href="https://lanzy1029.github.io/arProcessing/" />
    <link rel="icon" href="data:," />
    <title>Emoji Face AR · 表情派对</title>
  </head>
  <body class="app-loading">
    <main id="app" aria-label="Emoji 表情 AR 体验">
      <video id="camera" autoplay muted playsinline aria-hidden="true"></video>
      <div class="ambient" aria-hidden="true"></div>
      <div id="canvas-host" aria-hidden="true"></div>

      <header class="top-bar">
        <div class="app-identity">
          <span class="app-icon" aria-hidden="true">😊</span>
          <span>
            <strong>表情派对</strong>
            <small>Emoji Face AR · v2.1</small>
          </span>
        </div>
        <div class="privacy-badge" aria-label="摄像头画面仅在本机处理">
          <span aria-hidden="true">🔒</span>
          仅在本机
        </div>
      </header>

      <section id="startup-overlay" class="startup-overlay" aria-live="polite">
        <div class="startup-card">
          <div id="loading-spinner" class="loading-spinner" aria-hidden="true"></div>
          <h1 id="startup-title">正在准备相机</h1>
          <p id="startup-description">首次使用时，请在 Safari 中允许摄像头。</p>
          <button id="retry-button" class="retry-button" type="button" hidden>再试一次</button>
        </div>
      </section>

      <div id="status-pill" class="status-pill" role="status" aria-live="polite">
        <span class="status-signal" aria-hidden="true"></span>
        <span id="status-text">正在准备本地识别</span>
      </div>

      <div id="face-guide" class="face-guide" aria-hidden="true">
        <div class="guide-oval"></div>
        <p>把脸放进画面</p>
      </div>

      <section class="effect-sheet" aria-label="Emoji 特效选择">
        <div class="gesture-row">
          <div class="gesture-copy">
            <span class="gesture-face" aria-hidden="true">😉</span>
            <span><strong>眨眼</strong><small id="blink-caption">发射爱心</small></span>
          </div>
          <div class="effect-options" role="group" aria-label="选择眨眼特效">
            <button class="effect-option" type="button" data-effect-kind="blink" data-effect-preset="hearts" aria-label="眨眼：爱心" aria-pressed="true"><span>💗</span></button>
            <button class="effect-option" type="button" data-effect-kind="blink" data-effect-preset="sparkles" aria-label="眨眼：闪耀" aria-pressed="false"><span>✨</span></button>
            <button class="effect-option" type="button" data-effect-kind="blink" data-effect-preset="party" aria-label="眨眼：派对" aria-pressed="false"><span>🎉</span></button>
          </div>
        </div>

        <div class="gesture-row">
          <div class="gesture-copy">
            <span class="gesture-face" aria-hidden="true">😮</span>
            <span><strong>张大嘴巴</strong><small id="mouth-caption">喷出便便</small></span>
          </div>
          <div class="effect-options" role="group" aria-label="选择张嘴特效">
            <button class="effect-option" type="button" data-effect-kind="mouth" data-effect-preset="poop" aria-label="张嘴：搞怪" aria-pressed="true"><span>💩</span></button>
            <button class="effect-option" type="button" data-effect-kind="mouth" data-effect-preset="rainbow" aria-label="张嘴：彩虹" aria-pressed="false"><span>🌈</span></button>
            <button class="effect-option" type="button" data-effect-kind="mouth" data-effect-preset="fire" aria-label="张嘴：火焰" aria-pressed="false"><span>🔥</span></button>
          </div>
        </div>
      </section>

      <aside id="debug-panel" class="debug-panel" aria-label="诊断数据" hidden>
        <div class="debug-title">本地识别诊断</div>
        <pre id="debug-output">等待运行…</pre>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
